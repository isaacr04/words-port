[package]
name = "words"
version = "0.5.6"
authors = ["Peter Sonntag <peter@sonniger-tag.eu>"]
edition = "2024"
publish = false

[profile.release]
lto = true

[dependencies]
anyhow = "1"
formatx = "0.2.3"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
rand = "0.9"
relm4 = { version = "0.9", features = ["libadwaita", "gnome_47"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tr = { version = "0.1.11", features = ["po-translator"] }
