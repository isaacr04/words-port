[package]
name = "words"
version = "0.3.5"
authors = ["Peter Sonntag <peter@sonniger-tag.eu>"]
edition = "2021"
publish = false

[profile.release]
lto = true

[dependencies]
anyhow = "1"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
rand = "0.9.0"
relm4 = { version = "0.9", features = ["libadwaita", "gnome_46"] }
tracing = "0.1"
tracing-subscriber = "0.3"
